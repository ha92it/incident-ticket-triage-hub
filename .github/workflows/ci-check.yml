name: Triage & Security CI Check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  run-triage-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check Python script
        run: python -m py_compile triage_and_report.py

      - name: Basic secret pattern scan on repository files
        run: |
          python -c '
          import pathlib, re

          patterns = [
              r"AKIA[0-9A-Z]{16}",
              r"(?i)(api_key|secret_key|password|passwd|private_key)\s*[:=]\s*[\"'\''][^\"'\'']{8,}[\"'\'']",
          ]
          skip_dirs = {".git", ".github"}
          findings = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for idx, line in enumerate(text.splitlines(), start=1):
                  for pat in patterns:
                      if re.search(pat, line):
                          findings.append(f"{p}:{idx} matches {pat}")
          if findings:
              print("Potential secret findings:")
              for f in findings:
                  print(" -", f)
              raise SystemExit(1)
          print("No hardcoded secret patterns found.")
          '

      - name: Run triage and report script
        run: python triage_and_report.py

      - name: Upload generated report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-triage-summary
          path: reports/daily_summary.md
